name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Guards the two intake defects fixed in the assessment app: swallowed
      # write failures, and view events landing in the submissions table.
      - name: Assessment telemetry regression tests
        run: node test/assessment-telemetry.test.mjs
